<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAZARD 7007 Soundboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Archivo:wght@500;600&display=swap">
<style>
:root{--bg:#050505;--red:#ff1f1f;--amber:#ff8a1f;--ink:#e9e9e9;--dim:#8a8a8a;--panel:#161616;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 Archivo,Arial,sans-serif;min-height:100vh;overflow-x:hidden;background-image:radial-gradient(ellipse at 50% -10%,#2a0505 0,transparent 55%)}
body.on{animation:bg .5s steps(1) infinite}
@keyframes bg{0%{background-color:#1a0000}50%{background-color:#120800}100%{background-color:#050505}}
h1{font:700 clamp(40px,11vw,92px)/1 "Chakra Petch",Arial,sans-serif;margin:18px 0 4px;text-align:center;letter-spacing:.02em}
h1 b{color:var(--red);font-weight:700}
.sub{text-align:center;color:var(--dim);margin:0 12px 14px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 40px}
#fit{width:100%;position:relative}
#dev{position:absolute;left:0;top:0;width:720px;height:470px;transform-origin:0 0;background:linear-gradient(160deg,#1c1c1c,#0c0c0c);border-radius:26px;box-shadow:0 30px 60px #000,inset 0 0 0 2px #262626}
#dev:before,#dev:after{content:"";position:absolute;width:44px;height:60px;background:#0e0e0e;border-radius:8px;top:150px;box-shadow:inset 0 0 0 2px #222}
#dev:before{left:-30px;z-index:-1}#dev:after{right:-30px;z-index:-1}
.frame{position:absolute;inset:22px;border:2px solid #cfcfcf;border-radius:4px}
.lbl{position:absolute;font:600 17px Archivo,Arial;color:#f1f1f1;white-space:nowrap}
.led{position:absolute;width:12px;height:12px;border-radius:50%;background:#3a3a3a;box-shadow:inset 0 0 3px #000}
.led.lit{background:#ff3b2f;box-shadow:0 0 10px 3px #ff2a1f}
.led.g{background:#d8d8d8}.led.g.lit{background:#ffd37a;box-shadow:0 0 10px 3px #ff9d1f}
.knob{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b3b3b,#0b0b0b 70%);box-shadow:0 8px 14px #000,inset 0 0 0 4px #111,inset 0 0 0 6px #2a2a2a;touch-action:none;cursor:grab;outline:none}
.knob:focus-visible{box-shadow:0 0 0 3px var(--amber)}
.knob:before{content:"";position:absolute;inset:7px;border-radius:50%;background:repeating-conic-gradient(#000 0 4deg,#222 4deg 9deg);opacity:.55}
.knob i{position:absolute;left:50%;top:6%;width:5px;height:34%;margin-left:-2.5px;background:#f4f4f4;border-radius:3px;transform-origin:50% 100%}
.knob .cap{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2e2e2e,#090909);box-shadow:inset 0 0 0 2px #333}
#kv{left:92px;top:58px;width:128px;height:128px}
#ks{left:420px;top:76px;width:156px;height:156px}
.rj{position:absolute;left:62px;top:286px;width:112px;height:108px;background:#050505;border-radius:6px;box-shadow:inset 0 0 0 4px #1b1b1b}
.rj:after{content:"";position:absolute;left:24px;right:24px;top:20px;bottom:14px;background:repeating-linear-gradient(90deg,#8d8d8d 0 3px,#050505 3px 12px);border-radius:2px;clip-path:inset(0 0 55% 0)}
.plate{position:absolute;left:202px;top:286px;width:120px;height:52px;border:3px solid #f0f0f0;border-radius:6px;font:700 19px/22px "Chakra Petch";text-align:center;padding-top:2px;letter-spacing:.04em}
.plate span{display:block;border-bottom:2px solid #f0f0f0;margin:0 4px}
.m7{left:202px;top:372px;font:700 34px "Chakra Petch"}
.sq{position:absolute;top:328px;width:96px;height:80px;background:#0a0a0a;border-radius:6px;box-shadow:inset 0 0 0 4px #1c1c1c;display:grid;place-items:center;touch-action:none}
.sq button{all:unset;width:66px;height:56px;border-radius:7px;background:linear-gradient(#fdfdfd,#cfcfcf);box-shadow:0 6px 0 #6f6f6f,0 10px 12px #000;cursor:pointer;transition:transform .05s}
.sq button:active,.sq button.dn{transform:translateY(5px);box-shadow:0 1px 0 #6f6f6f}
.sq button:focus-visible{outline:3px solid var(--amber)}
.pos{position:absolute;font:600 15px Archivo;cursor:pointer;color:#f1f1f1;background:none;border:0;padding:0}
.pos.cur{color:#ffb26b}
#beacon{position:absolute;left:316px;top:30px;width:90px;height:44px;border-radius:44px 44px 6px 6px;background:radial-gradient(circle at 50% 80%,#7a0d0d,#2a0505);box-shadow:0 0 0 3px #111}
.on #beacon{animation:fl .32s steps(1) infinite}
@keyframes fl{0%{background:radial-gradient(circle at 50% 80%,#fff2c0,#ff2a1f 55%,#6a0000);box-shadow:0 0 40px 14px #ff2a1f,0 0 0 3px #111}50%{background:radial-gradient(circle at 50% 80%,#ffd08a,#ff8a1f 55%,#5a2a00);box-shadow:0 0 40px 14px #ff8a1f,0 0 0 3px #111}}
.ctl{margin-top:16px;background:var(--panel);border-radius:22px;padding:18px;box-shadow:inset 0 0 0 1px #2a2a2a}
.ind{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sa{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:#0b0b0b;box-shadow:inset 0 0 0 1px #2a2a2a;color:var(--dim)}
.sa:before{content:"";width:10px;height:10px;border-radius:50%;background:#3a3a3a}
.on .sa{color:#fff}.on .sa:before{background:var(--red);box-shadow:0 0 10px 3px var(--red);animation:fl2 .32s steps(1) infinite}
@keyframes fl2{50%{background:var(--amber);box-shadow:0 0 10px 3px var(--amber)}}
canvas{width:100%;height:96px;display:block;background:#0b0b0b;border-radius:14px;margin:14px 0;box-shadow:inset 0 0 0 1px #2a2a2a}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.play{all:unset;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;text-align:center;font:700 15px/1.1 "Chakra Petch";cursor:pointer;background:radial-gradient(circle at 40% 30%,#ff4a3a,#a30b0b 70%);box-shadow:0 0 0 5px #1a0000,0 0 26px #ff1f1f66,0 8px 0 #4d0000;transition:transform .06s}
.play:active{transform:translateY(5px);box-shadow:0 0 0 5px #1a0000,0 0 26px #ff1f1f66,0 3px 0 #4d0000}
.play small{display:block;font:600 11px Archivo;opacity:.85}
.play:focus-visible,.pill:focus-visible,.up:focus-visible{outline:3px solid var(--amber)}
.pill{all:unset;cursor:pointer;padding:13px 22px;border-radius:99px;background:#0e0e0e;box-shadow:inset 0 0 0 1px #333;font-weight:600;min-width:104px;text-align:center}
.pill:active{background:#222}.pill[aria-pressed=true]{background:#3a0b0b;box-shadow:inset 0 0 0 2px var(--red);color:#fff}
.vol{display:flex;align-items:center;gap:12px;margin:18px auto 4px;max-width:420px}
input[type=range]{flex:1;accent-color:var(--red);height:32px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:16px}
.slot{background:#0e0e0e;border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px #2a2a2a;display:flex;gap:8px;align-items:center;justify-content:space-between}
.slot b{display:block;font-weight:600}.slot em{font-style:normal;color:var(--dim);font-size:12px}
.slot .go{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;background:#2a0b0b;font-weight:600}
.slot .go.act{background:var(--red);color:#fff}
.up{all:unset;cursor:pointer;color:var(--amber);font-size:12px;text-decoration:underline}
select{font:inherit;color:var(--ink);background:#0b0b0b;border:1px solid #333;border-radius:10px;padding:10px;margin:8px 6px 0 0;min-height:44px;max-width:100%}
#msg{min-height:24px;margin-top:12px;text-align:center;color:var(--amber)}
@media (prefers-reduced-motion:reduce){.on,.on #beacon,.on .sa:before{animation:none!important}}
</style></head><body>
<div class="wrap">
<h1>HAZARD <b>7007</b></h1>
<p class="sub">Панель спецсигналов. Крутите ручки, жмите кнопки — звук играет прямо в браузере.</p>
<div id="fit"><div id="dev">
<div class="frame"></div><div id="beacon"></div>
<div class="led g" id="ledV" style="left:68px;top:166px"></div><div class="lbl" style="left:96px;top:196px">OFF/VOL</div>
<div class="knob" id="kv" tabindex="0" role="slider" aria-label="Громкость" aria-valuemin="0" aria-valuemax="100"><i></i><div class="cap"></div></div>
<button class="pos" data-p="hilo" style="left:318px;top:96px">HILO</button><div class="led g" id="l-hilo" style="left:370px;top:100px"></div>
<button class="pos" data-p="yelp" style="left:304px;top:126px">YELP</button>
<button class="pos" data-p="wail" style="left:290px;top:176px">WAIL</button>
<button class="pos" data-p="stby" style="left:262px;top:212px">STANDBY</button>
<div class="knob" id="ks" tabindex="0" role="slider" aria-label="Режим сирены"><i></i><div class="cap"></div></div>
<div class="rj"></div><div class="plate"><span>PREMIER</span>HAZARD</div><div class="lbl m7">7007</div>
<div class="lbl" style="left:352px;top:262px;line-height:20px">PA<br>MAN</div><div class="led g" id="l-man" style="left:402px;top:292px"></div>
<div class="lbl" style="left:468px;top:262px;line-height:20px">RADIO<br>HORN</div><div class="led g" id="l-horn" style="left:462px;top:292px"></div>
<div class="sq" style="left:344px"><button id="bMan" aria-label="MAN — удерживать"></button></div>
<div class="sq" style="left:468px"><button id="bHorn" aria-label="Правая кнопка"></button></div>
<div class="lbl" id="aL" style="left:344px;top:414px;width:96px;text-align:center;font-size:13px;color:#ffb26b"></div><div class="lbl" id="aR" style="left:468px;top:414px;width:96px;text-align:center;font-size:13px;color:#ffb26b"></div>
</div></div>

<div class="ctl">
<div class="ind"><span class="sa" id="sa">SOUND ACTIVE</span><span id="now" style="color:var(--dim)">Ожидание</span></div>
<canvas id="cv" width="900" height="192"></canvas>
<div class="row">
<button class="pill" id="stop">■ STOP</button>
<button class="play" id="play">PLAY<br>7007<small>полный сигнал</small></button>
<button class="pill" id="loop" aria-pressed="false">⟲ LOOP</button>
</div>
<div class="vol"><span>Громкость</span><input id="vol" type="range" min="0" max="100" value="70" aria-label="Громкость"><b id="vp">70%</b></div>
<div id="msg" role="status" aria-live="polite"></div>
<div class="slots" id="assign"><div class="slot" style="display:block"><b>Левая кнопка</b><select id="asL" aria-label="Звук левой кнопки"></select><select id="mdL" aria-label="Режим левой кнопки"><option value="hold">играет, пока держу</option><option value="toggle">нажал — вкл, ещё раз — выкл</option></select></div><div class="slot" style="display:block"><b>Правая кнопка</b><select id="asR" aria-label="Звук правой кнопки"></select><select id="mdR" aria-label="Режим правой кнопки"><option value="hold">играет, пока держу</option><option value="toggle">нажал — вкл, ещё раз — выкл</option></select></div></div>
<div class="slots" id="slots"></div>
</div></div>
<input type="file" id="file" accept="audio/mpeg,audio/wav,audio/x-wav,.mp3,.wav" hidden>

 const on=!!cur||!!(bv.L||bv.R);document.body.classList.toggle("on",on);
 $("now").textContent=on?[cur&&SL[cur.k].n,bv.L&&"лев.: "+SL[bv.L.k].n,bv.R&&"прав.: "+SL[bv.R.k].n].filter(Boolean).join(" + "):"Ожидание";
 document.querySelectorAll(".go").forEach(g=>g.classList.toggle("act",!!cur&&cur.k===g.dataset.k));
 $("l-man").classList.toggle("lit",!!bv.L);$("l-horn").classList.toggle("lit",!!bv.R);$("l-hilo").classList.toggle("lit",!!cur&&cur.k==="hilo");
 setSel(cur&&["wail","yelp","hilo"].includes(cur.k)?cur.k:(cur?sel:"stby"),true)
}
function setVol(v){vol=Math.max(0,Math.min(1,v));if(master)master.gain.value=vol;$("vol").value=Math.round(vol*100);$("vp").textContent=Math.round(vol*100)+"%";
 kv.style.setProperty("--a",0);kv.querySelector("i").style.transform=`rotate(${-135+vol*270}deg)`;kv.setAttribute("aria-valuenow",Math.round(vol*100));$("ledV").classList.toggle("lit",vol>0.02)}
/* knobs */
function drag(el,fn){let on=false,moved=false;
 const ang=e=>{const r=el.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI};
 el.addEventListener("pointerdown",e=>{on=true;moved=false;el.setPointerCapture(e.pointerId);fn(ang(e),"down")});
 el.addEventListener("pointermove",e=>{if(on){moved=true;fn(ang(e),"move")}});
 el.addEventListener("pointerup",e=>{if(on){on=false;fn(ang(e),moved?"up":"tap")}});
}
const kv=$("kv"),ks=$("ks");
drag(kv,a=>{a=Math.max(-135,Math.min(135,a));setVol((a+135)/270)});
kv.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowUp")setVol(vol+.05);if(e.key==="ArrowLeft"||e.key==="ArrowDown")setVol(vol-.05)});
$("vol").oninput=e=>setVol(e.target.value/100);
const PA={hilo:-62,yelp:-38,wail:-12,stby:14},ORD=["stby","wail","yelp","hilo"];
function setSel(p,silent){sel=p;ks.querySelector("i").style.transform=`rotate(${PA[p]}deg)`;ks.setAttribute("aria-valuetext",p.toUpperCase());
 document.querySelectorAll(".pos").forEach(b=>b.classList.toggle("cur",b.dataset.p===p))}
function pick(p){setSel(p);if(p==="stby")stopMain();else play(p)}
drag(ks,(a,t)=>{if(t==="tap"){pick(ORD[(ORD.indexOf(sel)+1)%4]);return}if(t==="down")return;
 let best=sel,d=999;for(const p in PA){const x=Math.abs(PA[p]-a);if(x<d){d=x;best=p}}
 if(t==="move"&&best!==sel)setSel(best);if(t==="up")pick(best)});
ks.addEventListener("keydown",e=>{const i=ORD.indexOf(sel);if(e.key==="ArrowRight"||e.key==="ArrowUp")pick(ORD[Math.min(3,i+1)]);if(e.key==="ArrowLeft"||e.key==="ArrowDown")pick(ORD[Math.max(0,i-1)])});
document.querySelectorAll(".pos").forEach(b=>b.onclick=()=>pick(b.dataset.p));
/* buttons */
function hold(el,k){const d=e=>{e.preventDefault();el.classList.add("dn");play(k)},u=()=>{if(el.classList.contains("dn")){el.classList.remove("dn");if(cur&&cur.k===k&&k==="man")stop()}};
 el.addEventListener("pointerdown",d);["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,u));
 el.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)d(e)});el.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")u()})}
const AS={L:"wail",R:"horn"},MD={L:"hold",R:"hold"},held={L:false,R:false};
async function voice(k){await ensure();const S=SL[k],b=S.own?main:S.buf;if(!b){msg(k==="horn"?"Для HORN нет звука. Нажмите «загрузить» у HORN и выберите MP3 или WAV.":"Звук не загружен.");return null}
 const src=ctx.createBufferSource();src.buffer=b;const lp=S.loop||(loopOn&&/^(full|horn)/.test(k)),s=S.own?S.s:0,e=S.own?S.e:b.duration;
 if(lp){src.loop=true;src.loopStart=s;src.loopEnd=e;src.start(0,s)}else src.start(0,s,e-s);src.connect(master);return src}
function stopSide(s){const v=bv[s];if(v){bv[s]=null;v.src.onended=null;try{v.src.stop()}catch(e){}}ui()}
async function press(s){if(bv[s]&&MD[s]==="toggle"){stopSide(s);return}stopSide(s);msg("");const k=AS[s],src=await voice(k);if(!src)return;
 if(MD[s]==="hold"&&!held[s]){try{src.stop()}catch(e){}return}
 const v={k,src};bv[s]=v;src.onended=()=>{if(bv[s]===v){bv[s]=null;ui()}};ui()}
[["L","bMan"],["R","bHorn"]].forEach(([s,id])=>{const el=$(id);
 const d=e=>{e.preventDefault();if(held[s])return;held[s]=true;el.classList.add("dn");press(s)},u=()=>{if(!held[s])return;held[s]=false;el.classList.remove("dn");if(MD[s]==="hold")stopSide(s)};
 el.addEventListener("pointerdown",d);["pointerup","pointerleave","pointercancel"].forEach(t=>el.addEventListener(t,u));
 el.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")d(e)});el.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")u()})});
function fillSel(){["L","R"].forEach(s=>{const e=$("as"+s);e.innerHTML=Object.keys(SL).map(k=>`<option value="${k}">${SL[k].n}${!SL[k].own&&!SL[k].buf?" (нужен файл)":""}</option>`).join("");e.value=AS[s]});lab()}
function lab(){$("aL").textContent=SL[AS.L].n;$("aR").textContent=SL[AS.R].n}
["L","R"].forEach(s=>{$("as"+s).onchange=e=>{stopSide(s);AS[s]=e.target.value;lab()};$("md"+s).onchange=e=>{stopSide(s);MD[s]=e.target.value}});fillSel();



$("play").onclick=()=>play("full");$("stop").onclick=()=>{stop();msg("")};
$("loop").onclick=()=>{loopOn=!loopOn;$("loop").setAttribute("aria-pressed",loopOn);if(cur&&/^(full|horn)/.test(cur.k))play(cur.k)};
/* slots */
let upK;const f=$("file");
for(const k in SL){const S=SL[k],d=document.createElement("div");d.className="slot";
 d.innerHTML=`<div><b>${S.n}</b><em id="e-${k}">${S.own?S.d:"нет звука"}</em><br><button class="up" data-k="${k}">загрузить MP3/WAV</button></div><button class="go" data-k="${k}">▶</button>`;$("slots").append(d)}
$("slots").addEventListener("click",e=>{const g=e.target.closest(".go"),u=e.target.closest(".up");
 if(g){const k=g.dataset.k;if(cur&&cur.k===k)stop();else play(k)}
 if(u){upK=u.dataset.k;f.value="";f.click()}});
f.onchange=async()=>{const file=f.files[0];if(!file)return;
 if(!/\.(mp3|wav)$/i.test(file.name)&&!/audio\/(mpeg|wav|x-wav)/.test(file.type)){msg("Нужен файл MP3 или WAV.");return}
 try{await ensure();const b=await ctx.decodeAudioData(await file.arrayBuffer());const S=SL[upK];S.buf=b;S.own=false;
  $("e-"+upK).textContent=file.name;fillSel();msg(`«${S.n}»: загружен ${file.name}`)}catch(e){msg("Файл не читается. Попробуйте другой MP3 или WAV.")}};
/* waveform */
const cv=$("cv"),g=cv.getContext("2d");
function draw(){const w=cv.width,h=cv.height,N=64,bw=w/N;g.clearRect(0,0,w,h);let a=null;
 if((cur||bv.L||bv.R)&&an){a=new Uint8Array(an.frequencyBinCount);an.getByteTimeDomainData(a)}
 for(let i=0;i<N;i++){let v=.06+.05*Math.sin(i*.7);
  if(a){let m=0;for(let j=0;j<2;j++)m=Math.max(m,Math.abs(a[(i*2+j)%a.length]-128)/128);v=Math.min(1,.08+m*1.5)}
  const bh=v*h*.9,x=i*bw+bw*.25;g.fillStyle=a?(i%2?"#ff3b2f":"#ff8a1f"):"#4a1212";g.shadowColor=a?"#ff1f1f":"transparent";g.shadowBlur=a?12:0;g.fillRect(x,(h-bh)/2,bw*.5,bh)}
 requestAnimationFrame(draw)}
draw();
/* fit panel */
function fit(){const w=$("fit").clientWidth,s=Math.min(1,w/720);$("dev").style.transform=`scale(${s})`;$("fit").style.height=(470*s)+"px";$("dev").style.left=(w-720*s)/2+"px"}
addEventListener("resize",fit);fit();setVol(.7);setSel("stby");
</script></body></html>
